<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemutar Musik</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{--bg:#120e1d;--panel:#1b1630cc;--line:#ffffff1a;--text:#f1edff;--muted:#a79ccf;--accent:#a78bfa}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:grid;grid-template-columns:340px 1fr;grid-template-rows:1fr auto}
#amb{position:fixed;inset:-80px;background:center/cover var(--img,none);filter:blur(70px) brightness(.45) saturate(1.3);transition:background-image .6s;z-index:-1}
aside,footer{background:var(--panel);backdrop-filter:blur(14px)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside header{padding:16px;display:grid;gap:10px}
h1{font-size:1.2rem}
.btn{background:var(--accent);color:#1b1630;border-radius:10px;padding:10px;cursor:pointer;font-weight:600;text-align:center}
input[type=search]{background:#ffffff12;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:10px;width:100%}
#list{list-style:none;padding:0 8px;overflow-y:auto;flex:1}
#list li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
#list li:hover{background:#ffffff10}
#list li.on{background:#a78bfa33}
#list img{width:42px;height:42px;border-radius:6px;object-fit:cover;flex:none}
#list b{display:block;font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list small{color:var(--muted)}
#list div{min-width:0}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;min-height:0}
#cover{width:min(42vh,340px);aspect-ratio:1;border-radius:18px;object-fit:cover;box-shadow:0 24px 70px #000a}
#judul{font-size:1.8rem;margin-top:22px}
#artis{color:var(--muted);margin-top:4px}
#viz{width:min(90%,520px);height:90px;margin-top:20px}
footer{grid-column:1/-1;border-top:1px solid var(--line);padding:12px 20px;display:grid;gap:8px}
.ctrl{display:flex;justify-content:center;align-items:center;gap:18px}
.ctrl button{background:none;border:0;color:var(--text);font-size:1.3rem;cursor:pointer;opacity:.85}
.ctrl button.aktif{color:var(--accent);opacity:1}
#play{background:var(--accent);color:#1b1630;border-radius:50%;width:48px;height:48px;font-size:1.15rem;opacity:1}
.bar{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.bar input{flex:1;accent-color:var(--accent)}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid #ddd6fe;outline-offset:2px}
@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:220px 1fr auto}main{padding:12px}}
</style>
</head>
<body>
<div id="amb"></div>
<aside>
  <header>
    <h1>Pustaka Musik</h1>
    <label class="btn">Pilih folder musik<input id="folder" type="file" webkitdirectory multiple hidden></label>
    <input id="cari" type="search" placeholder="Cari lagu...">
  </header>
  <ul id="list"></ul>
</aside>
<main>
  <img id="cover" alt="Cover album">
  <h2 id="judul">Belum ada lagu</h2>
  <p id="artis">Pilih folder musik untuk mulai</p>
  <canvas id="viz"></canvas>
</main>
<footer>
  <div class="ctrl">
    <button id="acak" aria-label="Acak" title="Acak (S)">⇄</button>
    <button id="prev" aria-label="Sebelumnya" title="Sebelumnya (P)">⏮</button>
    <button id="play" aria-label="Putar" title="Putar/jeda (Spasi)">▶</button>
    <button id="next" aria-label="Berikutnya" title="Berikutnya (N)">⏭</button>
    <button id="ulang" aria-label="Ulang" title="Ulang (R)">↻</button>
  </div>
  <div class="bar">
    <span id="now">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="dur">0:00</span>
    <span>Vol</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" style="max-width:110px">
  </div>
</footer>
<script>
const audio=new Audio(), $=id=>document.getElementById(id);
const DEF="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2d2450"/><text x="50" y="62" font-size="44" text-anchor="middle" fill="#a78bfa">♪</text></svg>');
let lagu=[],tampil=[],idx=-1,acak=false,ulang=false,ctx,an,data;
$("cover").src=DEF;

$("folder").onchange=e=>{
  lagu=[...e.target.files].filter(f=>/\.(mp3|flac|wav|ogg|m4a|opus)$/i.test(f.name)).map(f=>({file:f,url:URL.createObjectURL(f),judul:f.name.replace(/\.[^.]+$/,""),artis:"Artis tidak diketahui",cover:DEF}));
  lagu.sort((a,b)=>a.judul.localeCompare(b.judul));
  filter(); lagu.forEach(baca);
};
function baca(l){
  if(!window.jsmediatags)return;
  jsmediatags.read(l.file,{onSuccess:({tags})=>{
    if(tags.title)l.judul=tags.title;
    if(tags.artist)l.artis=tags.artist;
    if(tags.picture)l.cover=URL.createObjectURL(new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format}));
    renderList(); if(tampil[idx]===l)info(l);
  },onError:()=>{}});
}
function filter(){
  const q=$("cari").value.toLowerCase(),s=tampil[idx];
  tampil=lagu.filter(l=>(l.judul+" "+l.artis).toLowerCase().includes(q));
  idx=s?tampil.indexOf(s):-1; renderList();
}
$("cari").oninput=filter;
function renderList(){
  const ul=$("list"); ul.innerHTML="";
  tampil.forEach((l,i)=>{
    const li=document.createElement("li"); li.tabIndex=0; if(i===idx)li.className="on";
    const im=new Image(); im.src=l.cover; im.alt="";
    const d=document.createElement("div"), b=document.createElement("b"), s=document.createElement("small");
    b.textContent=l.judul; s.textContent=l.artis; d.append(b,s); li.append(im,d);
    li.onclick=()=>putar(i); li.onkeydown=e=>{if(e.key==="Enter")putar(i)};
    ul.appendChild(li);
  });
}
function info(l){
  $("judul").textContent=l.judul; $("artis").textContent=l.artis; $("cover").src=l.cover;
  $("amb").style.setProperty("--img",`url("${l.cover}")`); document.title=l.judul+" · Pemutar Musik";
  if("mediaSession" in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:l.judul,artist:l.artis,artwork:[{src:l.cover}]});
}
function viz(){
  if(ctx)return;
  ctx=new AudioContext(); const src=ctx.createMediaElementSource(audio);
  an=ctx.createAnalyser(); an.fftSize=128; src.connect(an); an.connect(ctx.destination);
  data=new Uint8Array(an.frequencyBinCount); gambar();
}
function gambar(){
  requestAnimationFrame(gambar);
  const c=$("viz"),g=c.getContext("2d"),w=c.width=c.clientWidth,h=c.height=c.clientHeight;
  an.getByteFrequencyData(data); const n=Math.floor(data.length*.75),bw=w/n;
  g.fillStyle="#c4b5fd";
  for(let i=0;i<n;i++){const v=data[i]/255*h; g.fillRect(i*bw+1,h-v,bw-2,v);}
}
function putar(i){
  if(!tampil.length)return;
  viz(); if(ctx.state==="suspended")ctx.resume();
  idx=(i+tampil.length)%tampil.length; const l=tampil[idx];
  audio.src=l.url; audio.play(); info(l); renderList();
}
const berikut=()=>putar(acak?Math.floor(Math.random()*tampil.length):idx+1);
const toggle=()=>{if(idx<0)return putar(0);audio.paused?audio.play():audio.pause()};
$("play").onclick=toggle; $("next").onclick=berikut; $("prev").onclick=()=>putar(idx-1);
$("acak").onclick=()=>{acak=!acak;$("acak").classList.toggle("aktif",acak)};
$("ulang").onclick=()=>{ulang=!ulang;$("ulang").classList.toggle("aktif",ulang)};
audio.onplay=()=>{$("play").textContent="⏸"};
audio.onpause=()=>{$("play").textContent="▶"};
audio.onended=()=>ulang?putar(idx):berikut();
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
audio.ontimeupdate=()=>{$("now").textContent=fmt(audio.currentTime);$("seek").value=audio.duration?audio.currentTime/audio.duration*100:0};
audio.onloadedmetadata=()=>$("dur").textContent=fmt(audio.duration);
$("seek").oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
audio.volume=.8; $("vol").oninput=e=>audio.volume=e.target.value;
document.onkeydown=e=>{
  if(e.target.tagName==="INPUT"&&e.target.type!=="range")return;
  const k=e.key.toLowerCase();
  if(k===" "){e.preventDefault();toggle()}
  else if(k==="n")berikut(); else if(k==="p")putar(idx-1);
  else if(k==="s")$("acak").click(); else if(k==="r")$("ulang").click();
  else if(e.key==="ArrowRight")audio.currentTime+=5; else if(e.key==="ArrowLeft")audio.currentTime-=5;
};
if("mediaSession" in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler("play",toggle); m.setActionHandler("pause",toggle);
  m.setActionHandler("nexttrack",berikut); m.setActionHandler("previoustrack",()=>putar(idx-1));
}
</script>
</body>
</html>
